apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-service
  namespace: country-info
  labels:
    app: country-info-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: country-info-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: country-info-service
        version: "1.0.0"
    spec:
      # Graceful shutdown
      terminationGracePeriodSeconds: 30

      # Wait for PostgreSQL to be ready before starting app pods
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres-service 5432; do
                echo "PostgreSQL not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"

      containers:
        - name: country-info-service
          image: your-registry/country-info-service:1.0.0   # Replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: country-info-config

          # Sensitive env from Secret
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: country-info-secrets
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: country-info-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: country-info-secrets
                  key: DB_PASSWORD

          # Resource constraints
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Startup probe – gives the app up to 3 min to start
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 18
            periodSeconds: 10

          # Liveness probe – restart if the app hangs
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          # Readiness probe – remove from load balancer if not ready
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

      # Spread replicas across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - country-info-service
                topologyKey: kubernetes.io/hostname
