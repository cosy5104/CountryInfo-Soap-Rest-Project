# ─── Application Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: country-info-service
  namespace: country-info
  labels:
    app: country-info-service
spec:
  selector:
    app: country-info-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
  type: ClusterIP

---
# ─── Ingress (nginx) ──────────────────────────────────────────────────────────
# Requires: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: country-info-ingress
  namespace: country-info
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Uncomment to enable TLS with cert-manager:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: country-info.yourdomain.com   # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: country-info-service
                port:
                  number: 80
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - country-info.yourdomain.com
  #     secretName: country-info-tls
