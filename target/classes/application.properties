spring.application.name=country-info-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/countrydb
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# SOAP Web Service
soap.wsdl.url=${SOAP_WSDL_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}

# Server
server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.country.info=INFO
logging.level.org.springframework.ws=DEBUG
